<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول JSON للرسوم المتحركة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #e6e6e6;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #feb47b;
        }

        input[type="range"], select, button {
            padding: 12px 15px;
            border-radius: 12px;
            border: none;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="range"] {
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff7e5f;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 126, 95, 0.5);
        }

        button {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.4);
        }

        .preview-container {
            width: 100%;
            height: 400px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #animation-container {
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none;
        }

        .btn-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-row button {
            flex: 1;
            min-width: 150px;
        }

        .animation-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .animation-controls button {
            min-width: auto;
            padding: 10px 15px;
            font-size: 0.9rem;
        }

        .layers-panel {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .layer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .layer-controls {
            display: flex;
            gap: 8px;
        }

        .layer-controls button {
            padding: 5px 10px;
            font-size: 0.8rem;
            min-width: auto;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #aaa;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            .btn-row, .animation-controls {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>محول JSON للرسوم المتحركة</h1>
            <p>حمل ملف JSON، عدل الرسوم المتحركة، وحولها إلى SVG</p>
        </header>

        <main>
            <div class="glass-card">
                <div class="control-group">
                    <label for="json-upload">رفع ملف JSON:</label>
                    <input type="file" id="json-upload" accept=".json">
                </div>

                <div class="controls-grid">
                    <div class="control-group">
                        <label for="speed-control">سرعة الرسوم المتحركة:</label>
                        <input type="range" id="speed-control" min="0.1" max="3" step="0.1" value="1">
                    </div>

                    <div class="control-group">
                        <label for="size-control">حجم العرض:</label>
                        <input type="range" id="size-control" min="0.5" max="2" step="0.1" value="1">
                    </div>

                    <div class="control-group">
                        <label for="color-filter">فلتر اللون:</label>
                        <select id="color-filter">
                            <option value="none">بدون فلتر</option>
                            <option value="sepia">بني داكن (Sepia)</option>
                            <option value="grayscale">tones ألوان</option>
                            <option value="invert">عكس الألوان</option>
                            <option value="hue-rotate">تدوير الألوان</option>
                        </select>
                    </div>
                </div>

                <div class="btn-row">
                    <button id="export-json-btn">تصدير JSON المعدل</button>
                    <button id="convert-svg-btn">تحويل إلى SVG</button>
                </div>
            </div>

            <div class="glass-card">
                <h2>معاينة الرسوم المتحركة</h2>
                <div class="preview-container">
                    <div id="animation-container"></div>
                </div>
                
                <div class="animation-controls">
                    <button id="play-btn">تشغيل</button>
                    <button id="pause-btn">إيقاف مؤقت</button>
                    <button id="stop-btn">إيقاف</button>
                    <button id="loop-toggle">تكرار: فعال</button>
                </div>
                
                <div class="layers-panel">
                    <h3>الطبقات:</h3>
                    <div id="layers-list">
                        <!-- سيتم ملء الطبقات هنا -->
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>تطبيق تحويل JSON إلى SVG | تم إنشاؤه باستخدام Lottie-web</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const jsonUpload = document.getElementById('json-upload');
            const speedControl = document.getElementById('speed-control');
            const sizeControl = document.getElementById('size-control');
            const colorFilter = document.getElementById('color-filter');
            const exportJsonBtn = document.getElementById('export-json-btn');
            const convertSvgBtn = document.getElementById('convert-svg-btn');
            const animationContainer = document.getElementById('animation-container');
            
            // عناصر التحكم في الرسوم المتحركة
            const playBtn = document.getElementById('play-btn');
            const pauseBtn = document.getElementById('pause-btn');
            const stopBtn = document.getElementById('stop-btn');
            const loopToggle = document.getElementById('loop-toggle');
            
            // لوحة الطبقات
            const layersList = document.getElementById('layers-list');
            
            let anim = null;
            let currentAnimationData = null;
            let isLooping = true;
            let layers = [];
            
            jsonUpload.addEventListener('change', handleFileUpload);
            speedControl.addEventListener('input', updateAnimationSpeed);
            sizeControl.addEventListener('input', updateAnimationSize);
            colorFilter.addEventListener('change', updateColorFilter);
            exportJsonBtn.addEventListener('click', exportModifiedJson);
            convertSvgBtn.addEventListener('click', convertToSvg);
            
            // أحداث عناصر التحكم في الرسوم المتحركة
            playBtn.addEventListener('click', () => {
                if (anim) anim.play();
            });
            
            pauseBtn.addEventListener('click', () => {
                if (anim) anim.pause();
            });
            
            stopBtn.addEventListener('click', () => {
                if (anim) {
                    anim.stop();
                    anim.goToAndStop(0, true);
                }
            });
            
            loopToggle.addEventListener('click', toggleLoop);
            
            function handleFileUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const jsonData = JSON.parse(event.target.result);
                        currentAnimationData = jsonData;
                        
                        // استخراج الطبقات من البيانات
                        extractLayers(jsonData);
                        
                        loadLottieAnimation(jsonData);
                    } catch (error) {
                        alert('خطأ في قراءة الملف JSON');
                    }
                };
                reader.readAsText(file);
            }
            
            function extractLayers(data) {
                layers = [];
                
                if (data.layers) {
                    data.layers.forEach((layer, index) => {
                        layers.push({
                            id: index,
                            name: layer.nm || `الطبقة ${index + 1}`,
                            visible: layer.hd !== true,
                            type: layer.ty || 0,
                            originalIndex: index
                        });
                    });
                }
                
                renderLayersList();
            }
            
            function renderLayersList() {
                layersList.innerHTML = '';
                
                layers.forEach(layer => {
                    const layerItem = document.createElement('div');
                    layerItem.className = 'layer-item';
                    
                    layerItem.innerHTML = `
                        <span>${layer.name}</span>
                        <div class="layer-controls">
                            <button class="toggle-layer" data-id="${layer.id}">${layer.visible ? 'إخفاء' : 'إظهار'}</button>
                        </div>
                    `;
                    
                    layersList.appendChild(layerItem);
                });
                
                // إضافة أحداث الزر لتبديل الرؤية
                document.querySelectorAll('.toggle-layer').forEach(button => {
                    button.addEventListener('click', toggleLayerVisibility);
                });
            }
            
            function toggleLayerVisibility(e) {
                const layerId = parseInt(e.target.getAttribute('data-id'));
                const layer = layers.find(l => l.id === layerId);
                
                if (layer) {
                    layer.visible = !layer.visible;
                    
                    // تحديث النص على الزر
                    e.target.textContent = layer.visible ? 'إخفاء' : 'إظهار';
                    
                    // في Lottie، لا توجد طريقة مباشرة لتمكين/تعطيل الطبقات
                    // نعيد تحميل الرسوم المتحركة مع تعديل البيانات إذا كانت متاحة
                    if (currentAnimationData && currentAnimationData.layers) {
                        currentAnimationData.layers[layer.originalIndex].hd = !layer.visible;
                        
                        // إعادة تحميل الرسوم المتحركة
                        loadLottieAnimation(currentAnimationData);
                    }
                }
            }
            
            function loadLottieAnimation(data) {
                if (anim) {
                    anim.destroy();
                }
                
                anim = lottie.loadAnimation({
                    container: animationContainer,
                    renderer: 'svg',
                    loop: isLooping,
                    autoplay: true,
                    animationData: data
                });
            }
            
            function updateAnimationSpeed() {
                if (anim) {
                    anim.setSpeed(parseFloat(speedControl.value));
                }
            }
            
            function updateAnimationSize() {
                if (anim) {
                    const scaleValue = parseFloat(sizeControl.value);
                    animationContainer.style.transform = `scale(${scaleValue})`;
                }
            }
            
            function updateColorFilter() {
                const filterValue = colorFilter.value;
                const filterMap = {
                    'none': 'none',
                    'sepia': 'sepia(100%)',
                    'grayscale': 'grayscale(100%)',
                    'invert': 'invert(100%)',
                    'hue-rotate': 'hue-rotate(180deg)'
                };
                
                animationContainer.style.filter = filterMap[filterValue] || 'none';
            }
            
            function toggleLoop() {
                isLooping = !isLooping;
                if (anim) {
                    anim.loop = isLooping;
                }
                loopToggle.textContent = isLooping ? 'تكرار: فعال' : 'تكرار: غير فعال';
            }
            
            function exportModifiedJson() {
                if (!currentAnimationData) {
                    alert('يرجى تحميل ملف JSON أولاً');
                    return;
                }
                
                const blob = new Blob([JSON.stringify(currentAnimationData)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'animation-modified.json';
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 0);
            }
            
            function convertToSvg() {
                if (!anim) {
                    alert('لا توجد رسوم متحركة لتحويلها');
                    return;
                }
                
                // في الواقع، تحويل JSON Lottie إلى SVG يتطلب معالجة معقدة
                // هذا كود تجريبي لعرض رسالة
                alert('تم تحويل الرسوم المتحركة إلى SVG (الوظيفة الكاملة تحتاج إلى تنفيذ إضافي)');
                
                // كود تجريبي لجلب SVG من العارض
                const svgElement = animationContainer.querySelector('svg');
                if (svgElement) {
                    const serializer = new XMLSerializer();
                    const svgString = serializer.serializeToString(svgElement);
                    
                    const blob = new Blob([svgString], { type: 'image/svg+xml' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'animation.svg';
                    document.body.appendChild(a);
                    a.click();
                    
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 0);
                } else {
                    console.error('لا يمكن استخراج عنصر SVG');
                }
            }
        });
    </script>
</body>
</html>
