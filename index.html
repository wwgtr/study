        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b, #4f46e5);
            --correct-color: #4ade80;
            --incorrect-color: #f87171;
            --progress-color: #8b5cf6;
        }

        [data-theme="dark"] {
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b, #1e40af);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            background-image: url('https://image.qwenlm.ai/public_source/4eefde60-8723-4d73-bb8d-94690afe6530/1f3667b3c-92ae-491b-88b6-efcdde85aacf.png');
            background-size: cover;
            background-position: center;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .quiz-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .question-container {
            margin-bottom: 1.5rem;
        }

        .question-text {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.6;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background: var(--correct-color);
            color: white;
            animation: pulse 0.5s ease;
        }

        .option-btn.incorrect {
            background: var(--incorrect-color);
            color: white;
            animation: shake 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .explanation {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .next-btn {
            background: var(--progress-color);
        }

        .export-controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ratio-selector {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.5rem;
            color: var(--text-primary);
            backdrop-filter: blur(10px);
        }

        .progress-container {
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--progress-color);
            width: 0%;
            transition: width 0.4s ease;
        }

        .score-display {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 0.5rem;
        }

        footer {
            margin-top: auto;
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            fill: var(--text-primary);
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            fill: #8b5cf6;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .quiz-card {
                padding: 1.5rem;
            }
            
            .question-text {
                font-size: 1.2rem;
            }
            
            .option-btn {
                padding: 0.8rem;
                font-size: 1rem;
            }
        }
    </style>
</head>

        // Duplicate questions to reach 500 total
        const allQuestions = [];
        for (let i = 0; i < 10; i++) {
            allQuestions.push(...questions.map(q => ({ ...q })));
        }

        // Shuffle questions
        for (let i = allQuestions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
        }

        // State variables
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // DOM elements
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const explanation = document.getElementById('explanation');
        const ruleText = document.getElementById('ruleText');
        const nextBtn = document.getElementById('nextBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const progressFill = document.getElementById('progressFill');
        const exportBtn = document.getElementById('exportBtn');
        const ratioSelector = document.getElementById('ratioSelector');
        const quizCard = document.getElementById('quizCard');

        // Initialize quiz
        function initQuiz() {
            // Load saved state from localStorage
            const savedState = JSON.parse(localStorage.getItem('quizState'));
            if (savedState) {
                currentQuestionIndex = savedState.currentQuestionIndex;
                score = savedState.score;
            }
            
            showQuestion();
            updateProgress();
        }

        // Show current question
        function showQuestion() {
            const q = allQuestions[currentQuestionIndex];
            questionText.textContent = q.question;
            
            optionsContainer.innerHTML = '';
            q.option1 = q.option1.trim();
            q.option2 = q.option2.trim();
            
            const option1Btn = document.createElement('button');
            option1Btn.className = 'option-btn';
            option1Btn.textContent = q.option1;
            option1Btn.dataset.index = 0;
            option1Btn.addEventListener('click', () => handleAnswer(0));
            optionsContainer.appendChild(option1Btn);
            
            const option2Btn = document.createElement('button');
            option2Btn.className = 'option-btn';
            option2Btn.textContent = q.option2;
            option2Btn.dataset.index = 1;
            option2Btn.addEventListener('click', () => handleAnswer(1));
            optionsContainer.appendChild(option2Btn);
            
            explanation.classList.remove('show');
            nextBtn.disabled = true;
            answered = false;
        }

        // Handle answer selection
        function handleAnswer(selectedIndex) {
            if (answered) return;
            
            const q = allQuestions[currentQuestionIndex];
            const options = optionsContainer.querySelectorAll('.option-btn');
            
            // Disable all buttons
            options.forEach(btn => btn.disabled = true);
            
            // Highlight correct answer
            options[q.correctIndex].classList.add('correct');
            
            // Highlight incorrect answer if wrong
            if (selectedIndex !== q.correctIndex) {
                options[selectedIndex].classList.add('incorrect');
            } else {
                score++;
            }
            
            // Show explanation
            ruleText.textContent = q.rule;
            explanation.classList.add('show');
            
            // Enable next button
            nextBtn.disabled = false;
            answered = true;
            
            // Update score display
            updateProgress();
            
            // Save state to localStorage
            saveState();
        }

        // Move to next question
        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex >= allQuestions.length) {
                // End of quiz
                questionText.textContent = "انتهى الاختبار! أحسنت.";
                optionsContainer.innerHTML = '';
                explanation.classList.remove('show');
                nextBtn.disabled = true;
            } else {
                showQuestion();
            }
            
            // Save state to localStorage
            saveState();
        }

        // Update progress bar and score
        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / allQuestions.length) * 100;
            progressFill.style.width = `${progress}%`;
            scoreDisplay.textContent = `النتيجة: ${score}/${allQuestions.length}`;
        }

        // Save state to localStorage
        function saveState() {
            const state = {
                currentQuestionIndex,
                score
            };
            localStorage.setItem('quizState', JSON.stringify(state));
        }

        // Export screenshot
        async function exportScreenshot() {
            const ratio = ratioSelector.value;
            let width, height;
            
            switch(ratio) {
                case '9x16':
                    width = 1080;
                    height = 1920;
                    break;
                case '1x1':
                    width = 1080;
                    height = 1080;
                    break;
                case '4x5':
                    width = 1080;
                    height = 1350;
                    break;
                default:
                    width = 1080;
                    height = 1080;
            }
            
            // Temporarily change card size for export
            quizCard.style.width = `${width/4}px`;
            quizCard.style.height = `${height/4}px`;
            
            const canvas = await html2canvas(document.querySelector('.quiz-card'), {
                scale: 4,
                useCORS: true,
                backgroundColor: null
            });
            
            // Restore original size
            quizCard.style.width = '';
            quizCard.style.height = '';
            
            // Create download link
            const link = document.createElement('a');
            link.download = `quiz-result-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Event listeners
        nextBtn.addEventListener('click', nextQuestion);
        exportBtn.addEventListener('click', exportScreenshot);

        // Initialize the quiz when page loads
        window.onload = initQuiz;
